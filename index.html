<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート</title>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>
:root{
  --bg:#faf7f2;
  --main:#f0b344;
  --border:#e0cfa0;
  --ok:#4caf50;
  --note:#a6842c;
}


body{
  margin:0;
  font-family:"Hiragino Sans","メイリオ",sans-serif;
  background:var(--bg);
  color:#333;
  line-height:1.7;
}


/* ===== ヘッダー ===== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid var(--border);
  padding:10px;
  z-index:100;
}


.header-top{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}


h1{
  font-size:1.3em;
  margin:0;
  font-weight:900;
}


.mode-switch{
  margin-left:auto;
  display:flex;
  gap:6px;
}


.mode-switch button{
  padding:6px 14px;
  font-size:14px;
  border-radius:20px;
  border:2px solid #999;
  background:#fff;
  cursor:pointer;
}


.mode-switch button.active{
  background:#333;
  color:#fff;
}


/* ===== ナビ ===== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}


nav button{
  flex:1 1 auto;
  min-width:120px;
  padding:10px;
  font-size:16px;
  font-weight:700;
  border-radius:12px;
  border:3px solid var(--note);
  background:#fff;
  cursor:pointer;
}


nav button.active{
  background:var(--main);
  border-color:#000;
}


/* ===== メイン ===== */
main{
  padding:12px;
}


.section-title{
  font-size:1.4em;
  font-weight:800;
  border-bottom:3px solid var(--main);
  margin-bottom:12px;
}


.photo-box{
  background:#fff;
  border:4px solid var(--border);
  border-radius:14px;
  padding:14px;
}


.photo-img{
  width:100%;
  max-width:640px;
  margin:0 auto 10px;
  display:block;
  border-radius:12px;
  border:4px solid var(--border);
  cursor:pointer;
}


.ok-box{
  background:#e8f6e8;
  border:3px solid var(--ok);
  border-radius:10px;
  padding:10px;
  font-weight:800;
  text-align:center;
  margin:10px 0;
}


.note{
  background:#f5efe4;
  border-left:4px solid var(--note);
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}


/* ===== かんたんモード ===== */
.simple .note{
  display:none;
}
.simple .ok-box{
  font-size:1.3em;
}
.simple .section-title{
  font-size:1.5em;
}


/* ===== 写真拡大 ===== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  align-items:center;
  justify-content:center;
  touch-action:none;
}


.overlay img{
  max-width:95%;
  max-height:95%;
  transform:rotate(90deg);
  border-radius:12px;
}


.close{
  position:absolute;
  top:20px;
  right:20px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#000;
  color:#fff;
  font-size:32px;
  line-height:50px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>


<body class="detail">


<header>
  <div class="header-top">
    <h1>リモコンカー作り 写真で確認シート</h1>
    <div class="mode-switch">
      <button id="btnDetail" class="active">くわしく</button>
      <button id="btnSimple">かんたん</button>
    </div>
  </div>


  <nav id="nav"></nav>
</header>


<main>
  <div class="section-title" id="title"></div>
  <div class="photo-box">
    <img id="photo" class="photo-img">
    <div class="ok-box" id="ok"></div>
    <div class="note" id="note"></div>
  </div>
</main>


<div class="overlay" id="overlay">
  <div class="close" onclick="closePhoto()">×</div>
  <img id="overlayImg">
</div>


<script>
const steps = [
  {
    key:"battery",
    nav:"電気をためる",
    title:"電池をセットしよう",
    simpleTitle:"でんちをいれよう",
    img:"images/battery_box.jpg",
    ok:"＋と－があっていればOK！",
    simpleOk:"でんちのむき、あってる？",
    note:"電池の向きをよく見て入れましょう。"
  },
  {
    key:"wire1",
    nav:"電気の道①",
    title:"電池から電気を送る",
    simpleTitle:"でんきのみち",
    img:"images/wire_magnet.jpg",
    ok:"しっかりつながっている！",
    simpleOk:"ちゃんとついてる？",
    note:"磁石が外れていないか確認します。"
  },
  {
    key:"switch",
    nav:"方向えらび",
    title:"進む向きをえらぶ",
    simpleTitle:"すすむほうこう",
    img:"images/switch.jpg",
    ok:"前と後ろが切りかわる！",
    simpleOk:"まえ・うしろ かわる？",
    note:"スイッチの向きを確認しましょう。"
  },
  {
    key:"test",
    nav:"回るかチェック",
    title:"モーターを動かす",
    simpleTitle:"まわるかな？",
    img:"images/motor_test.jpg",
    ok:"くるくる回ればOK！",
    simpleOk:"まわった！",
    note:"指を近づけすぎないよう注意します。"
  },
  {
    key:"complete",
    nav:"動かす線",
    title:"リモコンと車をつなぐ線（動かすための電気の道）",
    simpleTitle:"うごかすせん",
    img:"images/car_complete.jpg",
    ok:"リモコンの合図が車にとどく！",
    simpleOk:"つながった！",
    note:"完成品を見て、作り上げよう。安全に走らせましょう。"
  }
];


let current = 0;
let simpleMode = false;


/* ナビ生成 */
const nav = document.getElementById("nav");
steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  if(i===0) b.classList.add("active");
  b.onclick=()=>show(i);
  nav.appendChild(b);
});


function show(i){
  current=i;
  document.querySelectorAll("nav button").forEach((b,idx)=>{
    b.classList.toggle("active",idx===i);
  });
  const s=steps[i];
  document.getElementById("title").textContent=simpleMode ? s.simpleTitle : s.title;
  document.getElementById("photo").src=s.img;
  document.getElementById("ok").textContent=simpleMode ? s.simpleOk : s.ok;
  document.getElementById("note").textContent=s.note;
}


/* モード切替 */
btnSimple.onclick=()=>{
  simpleMode=true;
  document.body.classList.add("simple");
  btnSimple.classList.add("active");
  btnDetail.classList.remove("active");
  show(current);
};


btnDetail.onclick=()=>{
  simpleMode=false;
  document.body.classList.remove("simple");
  btnDetail.classList.add("active");
  btnSimple.classList.remove("active");
  show(current);
};


/* 写真拡大 + スワイプ */
let startX=0;


photo.onclick=()=>{
  overlay.style.display="flex";
  overlayImg.src=photo.src;
};


overlay.onclick=closePhoto;
function closePhoto(){
  overlay.style.display="none";
}


overlay.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});


overlay.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>50){
    if(dx<0 && current<steps.length-1) current++;
    if(dx>0 && current>0) current--;
    show(current);
    overlayImg.src=steps[current].img;
  }
});


show(0);
</script>


</body>
</html>
