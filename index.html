<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👀みてつくるシート🚗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{font-family:sans-serif;background:#f5f5f5;max-width:960px;margin:0 auto;padding:15px}
header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:3px solid #4CAF50}
h1{font-size:2rem;color:#333;margin-bottom:5px}
.nav-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px}
.nav-btn{flex-shrink:0;padding:18px 22px;font-size:1.2rem;font-weight:bold;border:none;border-radius:20px;background:#2196F3;color:white;min-width:110px}
.nav-btn.active{background:#FF9800}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:20px}
.step-title{font-size:1.6rem;margin-bottom:15px;color:#1976D2}
.photo-wrap{position:relative;margin:15px 0}
.step-img{width:100%;border-radius:10px;display:block}
.tap-label{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:15px;font-size:0.9rem}
.ok-box{background:#E8F5E9;padding:15px;margin:15px 0;border-radius:10px;font-size:1.2rem;font-weight:bold;color:#2E7D32}
.note-box{background:#FFF3E0;padding:15px;margin:15px 0;border-radius:10px;font-size:1.1rem;color:#F57C00}
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:black;display:none;align-items:center;justify-content:center;z-index:1000;touch-action:none}
.overlay.active{display:flex}
.overlay-img{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;transform-origin:center center}
.close-btn{position:fixed;top:20px;right:20px;width:50px;height:50px;background:white;border:none;border-radius:50%;font-size:1.5rem;font-weight:bold;z-index:1001}
@media(min-width:768px){
.nav-scroll{overflow-x:visible;flex-wrap:wrap;justify-content:center}
.nav-btn{flex:1;min-width:auto}
h1{font-size:2.5rem}
.step-title{font-size:1.8rem}
}
</style>
</head>
<body>
<header><h1>👀みてつくるシート🚗</h1><p>リモコンカーの作り方を写真で確認</p></header>
<nav class="nav-scroll" id="nav"></nav>
<main id="content"></main>
<script>
const steps=[
{nav:"① でんち",title:"① でんち（BOX）",img:"images/battery_box.jpg",ok:"電池の向きOK！",note:"＋と－を確認します。"},
{nav:"② せん",title:"② 電池につける電線",img:"images/wire_magnet.jpg",ok:"線がつながった！",note:"磁石がしっかり付いているか確認。外れていないか見ます。"},
{nav:"③ スイッチ",title:"③ 前後切り替えスイッチ",img:"images/switch_complete.jpg",ok:"前後が切り替わる！",note:"左右SWを押して切り替わるか確認。向きを確認します。"},
{nav:"④ まわる",title:"④ モーターは回る？",img:"images/motor_test.jpg",ok:"回れば OK（又は、LEDチェッカーで調べる）",note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。"},
{nav:"⑤ みため",title:"⑤ 見た目完成（実験中）",img:"images/car_complete.jpg",ok:"つなぎ方をためそう！",note:"前後が逆なら入れ替えてみよう。",danger:true},
{nav:"⑥ かんせい",title:"⑥ ほんとうの完成！",img:"images/complete.jpg",ok:"前後に動いたら大成功！",note:"安全に走らせよう。",final:true}
];

let current=0;
const nav=document.getElementById('nav');
const content=document.getElementById('content');

// ナビゲーション作成
steps.forEach((s,i)=>{
const btn=document.createElement('button');
btn.className='nav-btn';
btn.textContent=s.nav;
btn.onclick=()=>show(i);
nav.appendChild(btn);
});

// コンテンツ表示
function show(i){
current=i;
Array.from(nav.children).forEach((b,idx)=>b.classList.toggle('active',idx===i));
const s=steps[i];
content.innerHTML=`
<div class="card">
  <div class="step-title">${s.title}</div>
  <div class="photo-wrap"><img src="${s.img}" class="step-img"><div class="tap-label">タップで拡大</div></div>
  <div class="ok-box">${s.ok}</div>
  <div class="note-box">${s.note}</div>
</div>`;
content.querySelector('.step-img').onclick=openOverlay;
}

// 拡大オーバーレイ
function openOverlay(e){
const overlay=document.createElement('div');
overlay.className='overlay active';

const img=document.createElement('img');
img.className='overlay-img';
img.src=e.target.src;

const close=document.createElement('button');
close.className='close-btn';
close.textContent='×';
close.onclick=()=>overlay.remove();

overlay.appendChild(img);
overlay.appendChild(close);
document.body.appendChild(overlay);
document.body.style.overflow='hidden';

// 拡大機能
let scale=1,posX=0,posY=0,startX=0,startY=0;
const pointers={};
const isMobile=window.innerHeight>window.innerWidth;

function update(){
if(isMobile){
img.style.transform=`translate(${posX}px,${posY}px) scale(${scale}) rotate(90deg)`;
}else{
img.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
}
}

img.onpointerdown=e=>{
e.stopPropagation();
pointers[e.pointerId]={x:e.clientX,y:e.clientY};
if(Object.keys(pointers).length===1){
startX=e.clientX-posX;
startY=e.clientY-posY;
}else if(Object.keys(pointers).length===2){
const ids=Object.keys(pointers);
const a=pointers[ids[0]],b=pointers[ids[1]];
initialDistance=Math.hypot(b.x-a.x,b.y-a.y);
}
};

img.onpointermove=e=>{
e.stopPropagation();
if(!pointers[e.pointerId])return;
pointers[e.pointerId]={x:e.clientX,y:e.clientY};
const ids=Object.keys(pointers);

if(ids.length===2){
const a=pointers[ids[0]],b=pointers[ids[1]];
const distance=Math.hypot(b.x-a.x,b.y-a.y);
if(initialDistance>0){
scale=Math.min(5,Math.max(1,scale*distance/initialDistance));
}
initialDistance=distance;
}else if(ids.length===1&&scale>1.01){
posX=e.clientX-startX;
posY=e.clientY-startY;
}
update();
};

const up=e=>{
e.stopPropagation();
delete pointers[e.pointerId];
if(Object.keys(pointers).length===1){
const id=Object.keys(pointers)[0];
startX=pointers[id].x-posX;
startY=pointers[id].y-posY;
initialDistance=0;
}
};

img.onpointerup=up;
img.onpointercancel=up;

overlay.onpointerdown=e=>{
if(e.target===overlay||e.target===close)overlay.remove();
};

// 要件通りのイベント遮断
img.onpointerdown=e=>e.stopPropagation();
img.onpointermove=e=>e.stopPropagation();
img.onpointerup=e=>e.stopPropagation();
img.onpointercancel=e=>e.stopPropagation();

update();
}

show(0);
</script>
</body>
</html>
