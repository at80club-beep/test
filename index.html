<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👀みてつくるシート🚗</title>
<style>
body{margin:0;font-family:sans-serif;background:#f2f2f2}
.container{max-width:960px;margin:0 auto;padding:12px}
h1{text-align:center;font-size:28px;margin:12px 0}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.nav button{flex:0 0 auto;padding:14px 18px;font-size:18px;font-weight:bold;border-radius:999px;border:none;background:#ddd}
.nav button.active{background:#4caf50;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:12px}
.card.ok{background:#e8f5e9}
.card.danger{background:#fff3e0}
.card.final{background:#e3f2fd}
.photo-wrap{position:relative}
.photo-wrap img{width:100%;border-radius:12px;touch-action:manipulation}
.photo-wrap span{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;padding:6px 10px;border-radius:12px;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9999;touch-action:none}
.overlay img{max-width:100%;max-height:100%;touch-action:none}
.close{position:absolute;top:16px;right:16px;font-size:28px;color:#fff;background:#000;border:none;border-radius:50%;width:44px;height:44px}
@media(min-width:768px){
.nav{overflow-x:visible}
}
</style>
</head>
<body>
<div class="container">
<h1>👀みてつくるシート🚗</h1>
<div class="nav" id="nav"></div>
<div id="content"></div>
</div>
<script>
const steps=[
{nav:"① でんち",title:"① でんち（BOX）",img:"images/battery_box.jpg",ok:"電池の向きOK！",note:"＋と－を確認します。"},
{nav:"② せん",title:"② 電池につける電線",img:"images/wire_magnet.jpg",ok:"線がつながった！",note:"磁石がしっかり付いているか確認。外れていないか見ます。"},
{nav:"③ スイッチ",title:"③ 前後切り替えスイッチ",img:"images/switch_complete.jpg",ok:"前後が切り替わる！",note:"左右SWを押して切り替わるか確認。向きを確認します。"},
{nav:"④ まわる",title:"④ モーターは回る？",img:"images/motor_test.jpg",ok:"回れば OK（又は、LEDチェッカーで調べる）",note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。"},
{nav:"⑤ みため",title:"⑤ 見た目完成（実験中）",img:"images/car_complete.jpg",ok:"つなぎ方をためそう！",note:"前後が逆なら入れ替えてみよう。",danger:true},
{nav:"⑥ かんせい",title:"⑥ ほんとうの完成！",img:"images/complete.jpg",ok:"前後に動いたら大成功！",note:"安全に走らせよう。",final:true}
];

// ナビゲーション作成
const nav=document.getElementById("nav");
const content=document.getElementById("content");
let current=0;

steps.forEach((s,i)=>{
const b=document.createElement("button");
b.textContent=s.nav;
b.addEventListener("pointerdown",()=>showStep(i));
nav.appendChild(b);
});

// ステップ表示関数
function showStep(i){
current=i;
[...nav.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));
const s=steps[i];
content.innerHTML=`
<div class="card${s.danger?" danger":s.final?" final":" ok"}">
<h2>${s.title}</h2>
<div class="photo-wrap">
<img src="${s.img}" alt="${s.title}">
<span>タップで拡大</span>
</div>
<p><strong>${s.ok}</strong></p>
<p>${s.note}</p>
</div>`;
content.querySelector('img').addEventListener("pointerdown",(e)=>openOverlay(s.img));
}

// オーバーレイ表示関数
function openOverlay(src){
document.body.style.overflow="hidden";
const overlay=document.createElement("div");
overlay.className="overlay";
const img=document.createElement("img");
img.src=src;

let scale=1,posX=0,posY=0;
const pointers={};
let lastDist=0,lastCenter=null;
const isMobile=window.innerHeight>window.innerWidth;

function updateTransform(){
if(isMobile){
img.style.transform=`translate(${posX}px,${posY}px) scale(${scale}) rotate(90deg)`;
}else{
img.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`;
}
}

// ポインターイベント処理
img.addEventListener("pointerdown",e=>{
e.stopPropagation();
pointers[e.pointerId]=e;
});

img.addEventListener("pointermove",e=>{
e.stopPropagation();
if(!(e.pointerId in pointers))return;
pointers[e.pointerId]=e;
const ids=Object.keys(pointers);

// 2本指ピンチズーム
if(ids.length===2){
const a=pointers[ids[0]],b=pointers[ids[1]];
const dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;
const dist=Math.hypot(dx,dy);
const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;
if(lastDist){
scale=Math.min(5,Math.max(1,scale*dist/lastDist));
posX+=cx-lastCenter.x;
posY+=cy-lastCenter.y;
updateTransform();
}
lastDist=dist;
lastCenter={x:cx,y:cy};
}

// 1本指ドラッグ
if(ids.length===1){
if(scale<=1.01)return;
posX+=e.movementX;
posY+=e.movementY;
updateTransform();
}
});

function onPointerUp(e){
delete pointers[e.pointerId];
lastDist=0;
lastCenter=null;
}

img.addEventListener("pointerup",onPointerUp);
img.addEventListener("pointercancel",onPointerUp);

// 閉じるボタン
const close=document.createElement("button");
close.className="close";
close.textContent="×";
close.addEventListener("pointerdown",closeOverlay);

overlay.addEventListener("pointerdown",e=>{
if(e.target===overlay)closeOverlay();
});

function closeOverlay(){
document.body.style.overflow="";
overlay.remove();
}

overlay.appendChild(img);
overlay.appendChild(close);
document.body.appendChild(overlay);
updateTransform();
}

showStep(0);
</script>
</body>
</html>
