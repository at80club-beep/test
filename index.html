<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👀みてつくるシート🚗</title>
<style>
/* --- 基本レイアウト --- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#f5f5f5;color:#333;max-width:960px;margin:0 auto;padding-top:80px}

.header{background:#4CAF50;color:#fff;padding:1rem;position:fixed;top:0;left:0;width:100%;z-index:1000;border-bottom:2px solid #2E7D32}
.header-content{display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin:0}

.nav-container{background:#fff;padding:.5rem;position:fixed;top:65px;left:0;width:100%;z-index:999;border-bottom:2px solid #ddd;max-width:960px;margin:0 auto}
.nav-scroll{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem}
.nav-btn{padding:0.8rem;background:#2196F3;color:#fff;border:none;border-radius:1rem;font-size:1rem;font-weight:bold;cursor:pointer;min-width:100px;flex-shrink:0}
.nav-btn.active{background:#FF9800}

.content{padding:1rem;margin-top:110px}
.card{background:#fff;border-radius:1rem;padding:1.5rem;margin-bottom:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.step-title{font-size:1.4rem;color:#1565C0;margin-bottom:1rem;border-bottom:3px solid #BBDEFB;padding-bottom:.5rem}

.photo-container{margin:1rem 0;border-radius:.8rem;background:#eee;overflow:hidden;position:relative}
.photo-wrapper{width:100%; position:relative; background:#fff}
.step-img{width:100%; height:auto; display:block; cursor:pointer}
.tap-label{background:rgba(0,0,0,.7);color:#fff;padding:.6rem 1rem;border-radius:2rem;font-size:.9rem;position:absolute;bottom:1rem;right:1rem}

.ok-box{background:#E8F5E9;padding:1.2rem;margin:1rem 0;border-radius:.8rem;color:#2E7D32;font-weight:bold;font-size:1.1rem;border-left:8px solid #4CAF50}
.note-box{background:#FFF3E0;padding:1.2rem;margin:1rem 0;border-radius:.8rem;color:#E65100;font-size:1rem;line-height:1.5}

/* --- 拡大オーバーレイ --- */
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:2000;display:none;align-items:center;justify-content:center;touch-action:none}
.overlay.active{display:flex}
.overlay-img-container{position:relative; transition:transform 0.3s ease-out}
.overlay-img{max-width:95vw; max-height:95vh; object-fit:contain}

/* 非常に大きな閉じるボタン（スマホを横にした時も右上に配置） */
.close-btn{position:fixed;top:1rem;right:1rem;background:#FF5252;color:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:2.5rem;font-weight:bold;cursor:pointer;z-index:2001;box-shadow:0 0 15px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center}

/* 持ち替えガイドイラスト */
.rotate-guide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.9);padding:2rem;border-radius:2rem;text-align:center;z-index:2002;font-weight:bold;pointer-events:none;transition:opacity 0.5s}
.rotate-guide.hidden{opacity:0}

/* ズームコントロール */
.zoom-controls{position:fixed;bottom:2rem;right:1.5rem;display:flex;flex-direction:column;gap:1rem;z-index:2001}
.zoom-btn{background:rgba(255,255,255,0.9);color:#333;border:none;border-radius:50%;width:55px;height:55px;font-size:1.8rem;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,0.3)}

.reference-btn{background:#fff;color:#4CAF50;border:none;border-radius:2rem;padding:.5rem 1.2rem;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <h1>👀みてつくるシート🚗</h1>
        <button class="reference-btn" id="referenceBtn">📚写真</button>
    </div>
</div>

<div class="nav-container"><div class="nav-scroll" id="nav"></div></div>
<main class="content" id="content"></main>

<div id="overlay" class="overlay">
    <button class="close-btn" id="closeOverlay">×</button>
    <div id="rotateGuide" class="rotate-guide">
        <div style="font-size:4rem; margin-bottom:1rem">📱➡平</div>
        <p style="font-size:1.2rem">スマホを横にすると<br>大きく見えます</p>
    </div>
    <div class="overlay-img-container" id="imgContainer">
        <img id="overlayImg" class="overlay-img" src="">
    </div>
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoom(0.2)">＋</button>
        <button class="zoom-btn" onclick="zoom(-0.2)">－</button>
        <button class="zoom-btn" onclick="resetZoom()">↻</button>
    </div>
</div>

<script>
const steps = [
    {nav:"①でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg", ok:"電池の向きOK！", note:"＋と－をよくみて入れましょう。"},
    {nav:"②せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg", ok:"線がつながった！", note:"磁石がピタッとついているか確認。"},
    {nav:"③スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg", ok:"前後が切り替わる！", note:"スイッチを動かしてみましょう。"},
    {nav:"④まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg", ok:"回れば大成功！", note:"ぶるぶる動くか確かめます。"},
    {nav:"⑤みため", title:"⑤ 見た目完成", img:"images/car_complete.jpg", ok:"つなぎ方をためそう！", note:"かっこいい車になってきたかな？"},
    {nav:"⑥かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg", ok:"動いたらおめでとう！", note:"広いところで走らせてみよう。"}
];

const content = document.getElementById('content');
const overlay = document.getElementById('overlay');
const overlayImg = document.getElementById('overlayImg');
const imgContainer = document.getElementById('imgContainer');
const rotateGuide = document.getElementById('rotateGuide');

let state = { scale: 1, rotation: 90 };

function init() {
    const nav = document.getElementById('nav');
    steps.forEach((step, i) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.textContent = step.nav;
        btn.onclick = () => showStep(i);
        nav.appendChild(btn);
    });
    showStep(0);
}

function showStep(index) {
    const step = steps[index];
    document.querySelectorAll('.nav-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    content.innerHTML = `
        <div class="card">
            <div class="step-title">${step.title}</div>
            <div class="photo-container" onclick="openOverlay('${step.img}')">
                <div class="photo-wrapper">
                    <img src="${step.img}" class="step-img">
                    <div class="tap-label">タップで拡大</div>
                </div>
            </div>
            <div class="ok-box">${step.ok}</div>
            <div class="note-box">${step.note}</div>
        </div>`;
}

function openOverlay(src) {
    overlayImg.src = src;
    overlay.classList.add('active');
    rotateGuide.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    
    resetZoom();
    updateOrientation();
    
    // ガイドを3秒後に消す
    setTimeout(() => rotateGuide.classList.add('hidden'), 3000);
}

function updateOrientation() {
    // 縦持ちなら90度回転、横持ちなら0度に戻す
    const isPortrait = window.innerHeight > window.innerWidth;
    state.rotation = isPortrait ? 90 : 0;
    applyTransform();
}

function zoom(delta) {
    state.scale = Math.max(0.5, Math.min(4, state.scale + delta));
    applyTransform();
}

function resetZoom() {
    state.scale = 1;
    applyTransform();
}

function applyTransform() {
    imgContainer.style.transform = `scale(${state.scale}) rotate(${state.rotation}deg)`;
}

// 持ち替え検知
window.addEventListener('resize', updateOrientation);

document.getElementById('closeOverlay').onclick = () => {
    overlay.classList.remove('active');
    document.body.style.overflow = 'auto';
};

init();
</script>
</body>
</html>
