<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👀みてつくるシート🚗</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Arial', 'Hiragino Sans', sans-serif;
    background: #f8f9fa;
    color: #333;
    line-height: 1.6;
    max-width: 960px;
    margin: 0 auto;
    padding: 15px;
    min-height: 100vh;
}

header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 4px solid #4CAF50;
}

h1 {
    font-size: 2rem;
    color: #2c3e50;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 1.1rem;
    color: #7f8c8d;
}

.nav-container {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 25px;
    padding-bottom: 10px;
}

.nav-scroll {
    display: inline-flex;
    gap: 10px;
    padding: 5px 10px;
    min-width: min-content;
}

.nav-btn {
    flex: 0 0 auto;
    padding: 18px 24px;
    font-size: 1.3rem;
    font-weight: bold;
    border-radius: 20px;
    border: 3px solid transparent;
    background: #3498db;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 130px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(50, 50, 93, 0.11);
}

.nav-btn:active {
    transform: scale(0.97);
}

.nav-btn.active {
    background: #e74c3c;
    border-color: #c0392b;
    box-shadow: 0 6px 10px rgba(231, 76, 60, 0.3);
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    border: 2px solid #e0e0e0;
}

.card.ok {
    border-left: 6px solid #27ae60;
}

.card.danger {
    border-left: 6px solid #e74c3c;
}

.card.final {
    border-left: 6px solid #9b59b6;
}

.step-title {
    font-size: 1.8rem;
    color: #2c3e50;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 3px solid #ecf0f1;
}

.photo-wrap {
    position: relative;
    margin: 20px 0;
    border-radius: 15px;
    overflow: hidden;
    background: #f5f5f5;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.step-img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
}

.tap-label {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 10px 18px;
    border-radius: 25px;
    font-size: 0.95rem;
    font-weight: bold;
    backdrop-filter: blur(5px);
}

.ok-text {
    background: #d5efdb;
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
    font-size: 1.3rem;
    font-weight: bold;
    color: #155724;
    border-left: 5px solid #27ae60;
}

.note-text {
    background: #fff3cd;
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
    font-size: 1.2rem;
    color: #856404;
    border-left: 5px solid #f39c12;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.98);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.overlay.active {
    opacity: 1;
    pointer-events: all;
}

.overlay-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.overlay-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    touch-action: none;
    transform-origin: center center;
    transition: transform 0.1s;
    will-change: transform;
}

.close-btn {
    position: absolute;
    top: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: none;
    font-size: 2rem;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    z-index: 10001;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    pointer-events: auto;
}

@media (min-width: 768px) {
    body {
        padding: 25px;
    }
    
    h1 {
        font-size: 2.5rem;
    }
    
    .nav-container {
        overflow-x: visible;
    }
    
    .nav-scroll {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 15px;
        width: 100%;
        min-width: auto;
    }
    
    .nav-btn {
        min-width: auto;
        width: 100%;
        padding: 20px 10px;
        font-size: 1.4rem;
    }
    
    .step-title {
        font-size: 2rem;
    }
    
    .ok-text, .note-text {
        font-size: 1.4rem;
        padding: 25px;
    }
    
    .close-btn {
        width: 70px;
        height: 70px;
        font-size: 2.2rem;
    }
}

@media (max-width: 480px) {
    .nav-btn {
        padding: 16px 20px;
        font-size: 1.2rem;
        min-width: 110px;
    }
    
    .step-title {
        font-size: 1.6rem;
    }
    
    .ok-text, .note-text {
        font-size: 1.2rem;
        padding: 18px;
    }
}
</style>
</head>
<body>
<header>
    <h1>👀みてつくるシート🚗</h1>
    <p class="subtitle">リモコンカーの作り方を写真で確認</p>
</header>

<div class="nav-container">
    <div class="nav-scroll" id="navButtons"></div>
</div>

<main id="content"></main>

<script>
const steps = [
    { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
      ok:"電池の向きOK！", note:"＋と－を確認します。" },
    { nav:"② せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
      ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },
    { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
      ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },
    { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
      ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },
    { nav:"⑤ みため", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
      ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },
    { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
      ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

let currentStep = 0;
const navButtons = document.getElementById('navButtons');
const content = document.getElementById('content');

function renderNavButtons() {
    navButtons.innerHTML = '';
    steps.forEach((step, index) => {
        const button = document.createElement('button');
        button.className = `nav-btn ${index === currentStep ? 'active' : ''}`;
        button.textContent = step.nav;
        button.addEventListener('click', () => {
            currentStep = index;
            updateContent();
            renderNavButtons();
        });
        navButtons.appendChild(button);
    });
}

function updateContent() {
    const step = steps[currentStep];
    
    let cardClass = 'card ok';
    if (step.danger) cardClass = 'card danger';
    if (step.final) cardClass = 'card final';
    
    content.innerHTML = `
        <div class="${cardClass}">
            <div class="step-title">${step.title}</div>
            <div class="photo-wrap">
                <img src="${step.img}" alt="${step.title}" class="step-img">
                <div class="tap-label">タップで拡大</div>
            </div>
            <div class="ok-text">${step.ok}</div>
            <div class="note-text">${step.note}</div>
        </div>
    `;
    
    const stepImg = content.querySelector('.step-img');
    stepImg.addEventListener('click', openOverlay);
}

let scale = 1;
let posX = 0;
let posY = 0;
let startX = 0;
let startY = 0;
let initialDistance = 0;
const pointers = {};
let isDragging = false;
let currentImg = null;
let isMobile = false;

function updateTransform() {
    if (!currentImg) return;
    
    if (isMobile) {
        currentImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale}) rotate(90deg)`;
    } else {
        currentImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
}

function openOverlay(e) {
    if (e) e.stopPropagation();
    
    const step = steps[currentStep];
    
    // オーバーレイ要素の作成
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    
    const contentDiv = document.createElement('div');
    contentDiv.className = 'overlay-content';
    
    const img = document.createElement('img');
    img.className = 'overlay-img';
    img.src = step.img;
    img.alt = step.title;
    
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-btn';
    closeBtn.textContent = '×';
    
    // 要素の追加（要件通りの順序）
    contentDiv.appendChild(img);
    overlay.appendChild(contentDiv);
    overlay.appendChild(closeBtn);
    document.body.appendChild(overlay);
    
    // 変数の初期化
    scale = 1;
    posX = 0;
    posY = 0;
    currentImg = img;
    isMobile = window.innerHeight > window.innerWidth;
    
    // 初期状態のtransformを設定
    updateTransform();
    
    // オーバーレイを表示
    setTimeout(() => overlay.classList.add('active'), 10);
    
    // スクロールを無効化
    document.body.style.overflow = 'hidden';
    
    // ポインター管理オブジェクト
    const pointers = {};
    
    // 画像のポインターイベント
    img.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        
        if (Object.keys(pointers).length === 1) {
            startX = e.clientX - posX;
            startY = e.clientY - posY;
        } else if (Object.keys(pointers).length === 2) {
            const ids = Object.keys(pointers);
            const p1 = pointers[ids[0]];
            const p2 = pointers[ids[1]];
            initialDistance = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        }
    });
    
    img.addEventListener('pointermove', (e) => {
        e.stopPropagation();
        if (!pointers[e.pointerId]) return;
        
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        const currentPointers = Object.values(pointers);
        
        if (currentPointers.length === 1) {
            // 1本指ドラッグの場合
            if (scale <= 1.01) return; // 要件通り
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        } else if (currentPointers.length === 2) {
            // 2本指ピンチズームの場合
            const p1 = currentPointers[0];
            const p2 = currentPointers[1];
            const currentDistance = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            
            if (initialDistance > 0) {
                const newScale = Math.min(Math.max(1, (currentDistance / initialDistance) * scale), 5);
                scale = newScale;
                updateTransform();
            }
        }
    });
    
    const handlePointerUp = (e) => {
        e.stopPropagation();
        delete pointers[e.pointerId];
        if (Object.keys(pointers).length === 0) {
            initialDistance = 0;
        }
    };
    
    img.addEventListener('pointerup', handlePointerUp);
    img.addEventListener('pointercancel', handlePointerUp);
    
    // オーバーレイ背景をタップで閉じる
    overlay.addEventListener('pointerdown', (e) => {
        if (e.target === overlay || e.target === closeBtn) {
            closeOverlay(overlay);
        }
    });
    
    // 閉じるボタンのイベント
    closeBtn.addEventListener('click', () => closeOverlay(overlay));
    
    // 画像のイベント伝播を完全に遮断（要件通り）
    img.addEventListener('pointerdown', e => e.stopPropagation());
    img.addEventListener('pointermove', e => e.stopPropagation());
    img.addEventListener('pointerup', e => e.stopPropagation());
    img.addEventListener('pointercancel', e => e.stopPropagation());
}

function closeOverlay(overlay) {
    overlay.classList.remove('active');
    setTimeout(() => {
        if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
        }
        document.body.style.overflow = '';
        scale = 1;
        posX = 0;
        posY = 0;
        currentImg = null;
    }, 300);
}

// 初期表示
renderNavButtons();
updateContent();
</script>
</body>
</html>
