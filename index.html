<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   基本
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans","メイリオ",sans-serif;
  background:#faf7f2;
  color:#333;
  line-height:1.7;
}

header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:10px;
  z-index:100;
}

.title{
  font-size:1.3em;
  font-weight:900;
  margin:0;
}

.subtitle{
  font-size:0.6em;
  color:#555;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

nav button{
  flex:1;
  min-height:48px;
  font-size:18px;
  font-weight:700;
  border:4px solid #a6842c;
  background:#fff;
  border-radius:12px;
}

nav button.active{
  background:#f0b344;
  border-color:#000;
}

main{
  padding:12px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  border-bottom:3px solid #f0b344;
  margin-bottom:12px;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:14px;
}

.photo-img{
  width:100%;
  max-width:640px;
  display:block;
  margin:0 auto 10px;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
}

.photo-hint{
  text-align:center;
  font-size:0.9em;
  color:#666;
  background:#f0f0f0;
  padding:8px;
  border-radius:8px;
}

.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:12px 0;
  font-weight:800;
  text-align:center;
}

.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  border-left:4px solid #a6842c;
}

/* =====================
   拡大表示（横向き固定）
===================== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  align-items:center;
  justify-content:center;
}

.overlay img{
  max-height:90vw;
  max-width:90vh;
  transform:rotate(90deg);
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:56px;
  height:56px;
  background:#000;
  color:#fff;
  font-size:36px;
  text-align:center;
  line-height:56px;
  border-radius:50%;
  border:3px solid #fff;
  cursor:pointer;
}

.rotate-hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,0.7);
  padding:10px 20px;
  border-radius:20px;
  font-size:16px;
}

/* PC・横向きでは回転しない */
@media (orientation:landscape){
  .overlay img{
    transform:none;
    max-width:95%;
    max-height:95%;
  }
}
</style>
</head>

<body>

<header>
  <h1 class="title">
    リモコンカー作り 写真で確認シート
    <span class="subtitle">（指導員用）</span>
  </h1>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電線</button>
    <button data-target="switch">スイッチ</button>
    <button data-target="test">モーターテスト</button>
    <button data-target="complete">完成</button>
  </nav>
</header>

<main>
  <div class="section-title" id="sectionTitle">電池BOX完成</div>

  <div class="photo-box">
    <img id="photo" src="images/battery_box.jpg" class="photo-img">
    <div class="photo-hint">📱 写真をタップすると横向きで拡大表示されます</div>
    <div class="ok-box" id="okMessage">✅ この写真と同じなら OK</div>
    <div class="note" id="note">電池の＋－向きを確認します。</div>
  </div>
</main>

<!-- 拡大表示 -->
<div id="overlay" class="overlay">
  <div class="close-btn" onclick="closePhoto()">×</div>
  <div class="rotate-hint">横向き表示</div>
  <img id="overlayImg">
</div>

<script>
const sections={
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じなら OK",
    note:"電池の＋－向きを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形なら OK",
    note:"磁石がしっかり付いているか確認。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"固定できていれば OK",
    note:"左右に倒して切り替わるか確認。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"回れば OK（又はLEDチェッカー）",
    note:"回らない場合は配線を確認。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"完成です！",
    note:"安全に走らせましょう。"
  }
};

const navButtons=document.querySelectorAll("#nav button");
const photo=document.getElementById("photo");
const sectionTitle=document.getElementById("sectionTitle");
const okMessage=document.getElementById("okMessage");
const note=document.getElementById("note");

navButtons.forEach(btn=>{
  btn.onclick=()=>{
    navButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const d=sections[btn.dataset.target];
    sectionTitle.textContent=d.title;
    photo.src=d.img;
    okMessage.textContent="✅ "+d.ok;
    note.textContent=d.note;
  };
});

const overlay=document.getElementById("overlay");
const overlayImg=document.getElementById("overlayImg");

photo.onclick=()=>{
  overlay.style.display="flex";
  overlayImg.src=photo.src;
};

function closePhoto(){
  overlay.style.display="none";
}
</script>

</body>
</html>
