<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 最重要：viewport設定を追加 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>👀みてつくるシート🚗 - おみぞつくるシート（改良版）</title>
<style>
/* ====== リセットと基本設定 ====== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ====== ベース設定（大きく見やすく） ====== */
body {
    font-family: 'メイリオ', Meiryo, 'ヒラギノ角ゴ Pro', 'Hiragino Kaku Gothic Pro', sans-serif;
    background-color: #f8f9fa;
    color: #333;
    line-height: 1.7;
    font-size: 18px; /* ベースを大きく */
    max-width: 1200px; /* PC向けに広めに */
    margin: 0 auto;
    padding: 20px 30px 60px;
    min-height: 100vh;
}

/* ====== PC向けの大きめ設定（768px以上） ====== */
@media (min-width: 768px) {
    body {
        font-size: 20px; /* PCではさらに大きく */
        padding: 30px 40px 80px;
    }
    
    h1 {
        font-size: 2.2rem !important; /* PCで特大に */
        margin-bottom: 1rem !important;
    }
    
    .step-title {
        font-size: 1.8rem !important;
        margin-bottom: 1.5rem !important;
    }
    
    .card {
        padding: 2rem !important;
        margin-bottom: 2rem !important;
        border-radius: 1.2rem !important;
    }
}

/* ====== ヘッダー ====== */
.header {
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: white;
    padding: 1.5rem 2rem;
    margin-bottom: 2rem;
    border-radius: 1rem;
    box-shadow: 0 6px 20px rgba(76, 175, 80, 0.2);
    position: relative;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: 0.3;
    z-index: 1;
}

.header-content {
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 0.8rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
}

.header p {
    font-size: 1.1rem;
    opacity: 0.95;
    margin: 0;
}

/* ====== ナビゲーション ====== */
.nav-container {
    background: white;
    border-radius: 1rem;
    padding: 1.2rem;
    margin-bottom: 2rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    border: 2px solid #e0f7fa;
    overflow-x: auto;
}

.nav-scroll {
    display: flex;
    gap: 1rem;
    padding: 0.5rem;
    flex-wrap: nowrap;
    min-width: min-content;
}

.nav-btn {
    padding: 1.2rem 1.8rem;
    background: linear-gradient(135deg, #2196F3, #1976D2);
    color: white;
    border: none;
    border-radius: 0.8rem;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    min-width: 140px;
    flex-shrink: 0;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
    white-space: nowrap;
}

.nav-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(33, 150, 243, 0.4);
}

.nav-btn.active {
    background: linear-gradient(135deg, #FF9800, #F57C00);
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
}

/* ====== コンテンツカード ====== */
.card {
    background: white;
    border-radius: 1rem;
    padding: 1.8rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border-left: 6px solid #2196F3;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.card.danger {
    border-left-color: #f44336;
    background: linear-gradient(to right, #fff 95%, #ffebee 100%);
}

.card.final {
    border-left-color: #4CAF50;
    background: linear-gradient(to right, #fff 95%, #e8f5e9 100%);
}

.step-title {
    font-size: 1.5rem;
    color: #1565C0;
    margin-bottom: 1.2rem;
    padding-bottom: 0.8rem;
    border-bottom: 3px solid #e3f2fd;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.step-title::before {
    content: "✅";
    font-size: 1.3rem;
}

/* ====== 写真コンテナ（大きく見やすく） ====== */
.photo-container {
    margin: 1.5rem 0;
    border-radius: 0.8rem;
    background: #f5f5f5;
    position: relative;
    min-height: 200px;
    max-height: 400px;
    overflow: hidden;
    border: 2px dashed #bbdefb;
}

.photo-container.multi {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-height: 700px;
}

.photo-wrapper {
    width: 100%;
    background: white;
    border-radius: 0.6rem;
    overflow: hidden;
    position: relative;
    min-height: 180px;
    max-height: 350px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.step-img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    object-fit: contain;
    max-height: 320px;
    transition: transform 0.3s ease;
}

.step-img:hover {
    transform: scale(1.02);
}

.tap-label {
    background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(0,0,0,0.6));
    color: white;
    padding: 0.8rem 1.2rem;
    border-radius: 0.6rem;
    font-size: 1rem;
    font-weight: bold;
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    z-index: 10;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    gap: 8px;
}

.tap-label::before {
    content: "🔍";
    font-size: 1.2rem;
}

/* ====== 情報ボックス（大きく見やすく） ====== */
.ok-box {
    background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
    padding: 1.5rem;
    margin: 1.5rem 0;
    border-radius: 0.8rem;
    border-left: 5px solid #4CAF50;
    font-size: 1.2rem;
    font-weight: bold;
    color: #1B5E20;
    box-shadow: 0 3px 10px rgba(76, 175, 80, 0.1);
    display: flex;
    align-items: center;
    gap: 15px;
}

.ok-box::before {
    content: "🎯";
    font-size: 1.5rem;
}

.note-box {
    background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
    padding: 1.5rem;
    margin: 1.5rem 0;
    border-radius: 0.8rem;
    border-left: 5px solid #FF9800;
    font-size: 1.1rem;
    color: #E65100;
    box-shadow: 0 3px 10px rgba(255, 152, 0, 0.1);
    display: flex;
    align-items: center;
    gap: 15px;
}

.note-box::before {
    content: "💡";
    font-size: 1.5rem;
}

/* ====== 拡大表示オーバーレイ（PC向けに最適化） ====== */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.95);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.overlay.active {
    display: flex;
}

.overlay-content {
    position: relative;
    width: 95vw;
    height: 95vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.overlay-img-container {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.overlay-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    animation: zoomIn 0.3s ease-out;
    border-radius: 0.5rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

@keyframes zoomIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* PC用コントロール */
.overlay-controls {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    display: flex;
    gap: 1rem;
    z-index: 10001;
}

.overlay-btn {
    background: rgba(255, 255, 255, 0.9);
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 1.8rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    color: #333;
}

.overlay-btn:hover {
    background: white;
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.overlay-btn.close-btn {
    position: fixed;
    top: 2rem;
    right: 2rem;
    background: rgba(255, 255, 255, 0.95);
    color: #f44336;
    font-size: 2rem;
}

.overlay-btn.zoom-in { background: rgba(33, 150, 243, 0.9); color: white; }
.overlay-btn.zoom-out { background: rgba(255, 152, 0, 0.9); color: white; }
.overlay-btn.reset-zoom { background: rgba(76, 175, 80, 0.9); color: white; }

.controls-guide {
    position: fixed;
    top: 2rem;
    left: 2rem;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 1rem 1.5rem;
    border-radius: 1rem;
    font-size: 1.1rem;
    max-width: 300px;
    z-index: 10001;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    line-height: 1.5;
}

/* ====== レスポンシブ調整（モバイル向け） ====== */
@media (max-width: 767px) {
    body {
        padding: 15px;
        font-size: 16px;
    }
    
    .header {
        padding: 1rem;
        margin-bottom: 1rem;
    }
    
    h1 {
        font-size: 1.4rem;
    }
    
    .nav-btn {
        padding: 1rem 1.2rem;
        min-width: 110px;
        font-size: 1rem;
    }
    
    .card {
        padding: 1.2rem;
    }
    
    .photo-container {
        min-height: 150px;
        max-height: 300px;
    }
    
    .overlay-btn {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
    }
}

/* ====== ユーティリティクラス ====== */
.img-placeholder {
    width: 100%;
    height: 200px;
    background: linear-gradient(45deg, #f0f0f0 25%, #e0e0e0 25%, #e0e0e0 50%, #f0f0f0 50%, #f0f0f0 75%, #e0e0e0 75%);
    background-size: 40px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    border-radius: 0.5rem;
    font-size: 1.1rem;
    font-weight: bold;
}

.text-center { text-align: center; }
.mt-2 { margin-top: 2rem; }
.mb-2 { margin-bottom: 2rem; }
.p-2 { padding: 2rem; }

/* ====== フッター ====== */
.footer {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 2px solid #e0e0e0;
    text-align: center;
    color: #666;
    font-size: 0.9rem;
}

/* ====== アクセシビリティ ====== */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* ハイコントラストモード対応 */
@media (prefers-contrast: high) {
    body {
        background: white;
        color: black;
    }
    
    .card {
        border: 3px solid black;
    }
}

/* 文字サイズ調整用ユーティリティ */
.text-large { font-size: 1.2em; }
.text-xlarge { font-size: 1.4em; }
.text-xxlarge { font-size: 1.6em; }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-content">
        <h1>👀みてつくるシート🚗</h1>
        <p>リモコンカーの作り方を写真で確認 - PCでも大きく見やすい表示</p>
    </div>
</div>

<!-- 文字サイズ調整ボタン（PC向け） -->
<div class="nav-container text-center">
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <button class="nav-btn" onclick="adjustTextSize('normal')">標準サイズ</button>
        <button class="nav-btn" onclick="adjustTextSize('large')">大きく</button>
        <button class="nav-btn" onclick="adjustTextSize('xlarge')">さらに大きく</button>
    </div>
</div>

<!-- ナビゲーション -->
<div class="nav-container">
    <div class="nav-scroll" id="nav">
        <!-- ナビゲーションボタンはJavaScriptで生成 -->
    </div>
</div>

<!-- メインコンテンツ -->
<main class="content" id="content">
    <!-- ステップ内容はJavaScriptで生成 -->
</main>

<!-- 拡大表示用オーバーレイ -->
<div class="overlay" id="overlay">
    <div class="overlay-content">
        <div class="overlay-img-container">
            <img id="overlayImg" class="overlay-img" src="" alt="拡大表示">
        </div>
    </div>
    
    <!-- コントロールボタン -->
    <button class="overlay-btn close-btn" onclick="closeOverlay()" aria-label="閉じる">×</button>
    <div class="overlay-controls">
        <button class="overlay-btn zoom-in" onclick="zoomImage(0.2)" aria-label="拡大">+</button>
        <button class="overlay-btn zoom-out" onclick="zoomImage(-0.2)" aria-label="縮小">−</button>
        <button class="overlay-btn reset-zoom" onclick="resetZoom()" aria-label="リセット">↻</button>
    </div>
    
    <div class="controls-guide" id="controlsGuide">
        マウスホイールで拡大・縮小<br>
        ダブルクリックでリセット
    </div>
</div>

<!-- フッター -->
<div class="footer">
    <p>© 2024 みてつくるシート - PCでも見やすい表示に最適化</p>
    <p style="font-size: 0.8rem; margin-top: 0.5rem;">※画像はクリックで拡大表示できます</p>
</div>

<script>
// ====== ステップデータ ======
const steps = [
    {
        nav: "① でんち",
        title: "① でんち（BOX）をつくろう！",
        img: "images/battery_box.jpg",
        ok: "電池の向きOK！＋と－を確認します。",
        note: "電池は正しい向きで入れましょう。電気のあるものです！",
        danger: false
    },
    {
        nav: "② せん",
        title: "② 電池につける電線",
        img: "images/wire_magnet.jpg",
        ok: "線がつながった！磁石がしっかり付いているか確認",
        note: "ネオジム磁石用にしっかり接続しましょう。指を挟まないよう注意。",
        danger: false
    },
    {
        nav: "③ スイッチ",
        title: "③ 前後切り替えスイッチ",
        img: "images/switch_complete.jpg",
        ok: "前後が切り替わる！左右SWを押して確認",
        note: "タクトスイッチの向きを確認します。配線が間違っていないかチェック。",
        danger: false
    },
    {
        nav: "④ まわる",
        title: "④ モーターは回る？",
        img: "images/motor_test.jpg",
        ok: "回れば OK（又は、LEDチェッカーで調べる）",
        note: "モーターが回らない（LEDがつかない）場合は配線を確認。",
        danger: true
    },
    {
        nav: "⑤ みため",
        title: "⑤ 見た目完成（実験中）",
        img: ["images/car_complete.jpg", "images/3ami.gif"],
        ok: "つなぎ方をためそう！前後が逆なら入れ替えてみよう",
        note: "配線が複雑です。三つ編み（3ami）接続を確認。",
        danger: true
    },
    {
        nav: "⑥ かんせい",
        title: "⑥ ほんとうの完成！",
        img: "images/complete.jpg",
        ok: "前後に動いたら大成功！安全に走らせよう",
        note: "完成おめでとう！トラブルシューティングは参考アルバムを参照。",
        danger: false,
        final: true
    }
];

// ====== グローバル変数 ======
let currentStep = 0;
let overlayZoom = 1;

// ====== DOM要素の取得 ======
const nav = document.getElementById('nav');
const content = document.getElementById('content');
const overlay = document.getElementById('overlay');
const overlayImg = document.getElementById('overlayImg');
const controlsGuide = document.getElementById('controlsGuide');

// ====== ナビゲーション作成 ======
function createNavigation() {
    nav.innerHTML = '';
    steps.forEach((step, index) => {
        const button = document.createElement('button');
        button.className = 'nav-btn';
        button.textContent = step.nav;
        button.addEventListener('click', () => showStep(index));
        nav.appendChild(button);
    });
}

// ====== ステップ表示 ======
function showStep(index) {
    if (index < 0 || index >= steps.length) return;
    
    currentStep = index;
    
    // アクティブなボタンを更新
    document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
    });
    
    const step = steps[index];
    let photoHTML = '';
    
    // 画像が配列かどうかで分岐
    if (Array.isArray(step.img)) {
        const imageElements = step.img.map(img => `
            <div class="photo-wrapper">
                <img src="${img}" class="step-img" alt="${step.title}" 
                     onerror="handleImageError(this)"
                     onclick="openOverlay('${img}')">
                <div class="tap-label">クリックで拡大</div>
            </div>
        `).join('');
        
        photoHTML = `<div class="photo-container multi">${imageElements}</div>`;
    } else {
        photoHTML = `
            <div class="photo-container">
                <div class="photo-wrapper">
                    <img src="${step.img}" class="step-img" alt="${step.title}" 
                         onerror="handleImageError(this)"
                         onclick="openOverlay('${step.img}')">
                    <div class="tap-label">クリックで拡大</div>
                </div>
            </div>
        `;
    }
    
    // カードクラスの設定
    let cardClass = 'card';
    if (step.danger) cardClass += ' danger';
    if (step.final) cardClass += ' final';
    
    // コンテンツを更新
    content.innerHTML = `
        <div class="${cardClass}">
            <div class="step-title">${step.title}</div>
            ${photoHTML}
            <div class="ok-box">${step.ok}</div>
            <div class="note-box">${step.note}</div>
        </div>
    `;
}

// ====== 画像エラーハンドリング ======
function handleImageError(img) {
    img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="%23f5f5f5"/><text x="50%" y="50%" font-family="sans-serif" font-size="20" fill="%23666" text-anchor="middle" dy=".3em">画像を読み込めません</text></svg>';
    img.style.cursor = 'default';
    img.onclick = null;
}

// ====== 拡大表示機能 ======
function openOverlay(src) {
    if (src.includes('画像を読み込めません')) return;
    
    overlayImg.src = src;
    overlayZoom = 1;
    updateOverlayZoom();
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    
    // 操作ガイドを8秒後に非表示
    setTimeout(() => {
        controlsGuide.style.opacity = '0';
        controlsGuide.style.transition = 'opacity 1s';
    }, 8000);
}

function closeOverlay() {
    overlay.classList.remove('active');
    document.body.style.overflow = 'auto';
    controlsGuide.style.opacity = '1';
}

function zoomImage(delta) {
    overlayZoom += delta;
    overlayZoom = Math.max(0.5, Math.min(5, overlayZoom));
    updateOverlayZoom();
}

function resetZoom() {
    overlayZoom = 1;
    updateOverlayZoom();
}

function updateOverlayZoom() {
    overlayImg.style.transform = `scale(${overlayZoom})`;
}

// ====== 文字サイズ調整 ======
function adjustTextSize(size) {
    document.body.classList.remove('text-large', 'text-xlarge', 'text-xxlarge');
    
    switch(size) {
        case 'large':
            document.body.classList.add('text-large');
            break;
        case 'xlarge':
            document.body.classList.add('text-xlarge');
            break;
        case 'xxlarge':
            document.body.classList.add('text-xxlarge');
            break;
        default:
            // 標準サイズ
    }
    
    // 設定をローカルストレージに保存
    localStorage.setItem('textSize', size);
}

// ====== キーボードショートカット ======
document.addEventListener('keydown', (e) => {
    if (overlay.classList.contains('active')) {
        switch(e.key) {
            case 'Escape':
                closeOverlay();
                break;
            case '+':
            case '=':
                if (e.ctrlKey) zoomImage(0.2);
                break;
            case '-':
                if (e.ctrlKey) zoomImage(-0.2);
                break;
            case '0':
                if (e.ctrlKey) resetZoom();
                break;
        }
    } else {
        switch(e.key) {
            case 'ArrowRight':
                showStep(Math.min(currentStep + 1, steps.length - 1));
                break;
            case 'ArrowLeft':
                showStep(Math.max(currentStep - 1, 0));
                break;
            case 'Home':
                showStep(0);
                break;
            case 'End':
                showStep(steps.length - 1);
                break;
        }
    }
});

// ====== オーバーレイのマウスホイール操作 ======
overlay.addEventListener('wheel', (e) => {
    if (overlay.classList.contains('active')) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        zoomImage(delta);
    }
});

// ====== オーバーレイのダブルクリックでリセット ======
overlay.addEventListener('dblclick', (e) => {
    if (overlay.classList.contains('active') && e.target.classList.contains('overlay-img')) {
        resetZoom();
    }
});

// ====== 初期化 ======
function init() {
    createNavigation();
    showStep(0);
    
    // 保存された文字サイズを復元
    const savedSize = localStorage.getItem('textSize');
    if (savedSize) {
        adjustTextSize(savedSize);
    }
    
    // PC向けのヒントを表示
    if (window.innerWidth >= 768) {
        console.log('PC向け最適化表示が有効です');
        console.log('ショートカットキー: ←→キーでステップ移動, Ctrl+±でズーム');
    }
}

// ====== DOM読み込み完了時に初期化 ======
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// ====== グローバル関数として公開 ======
window.openOverlay = openOverlay;
window.closeOverlay = closeOverlay;
window.zoomImage = zoomImage;
window.resetZoom = resetZoom;
window.adjustTextSize = adjustTextSize;
window.showStep = showStep;
</script>
</body>
</html>
